<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>街の種</title>

    <link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512-v2.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="vendor/MarkerCluster.css" />
    <link rel="stylesheet" href="vendor/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css?v=3.0.51" />
</head>
<body>
    <button id="menu-btn" title="メニュー">☰</button>
    <button id="location-btn" title="現在地へ移動">🧭</button>
    <button id="reload-btn" title="最新の情報を再読み込み">↻</button>
    <button id="draw-select-btn" title="ペンで囲って表示">🖊</button>
    <button id="municipality-search-btn" title="万博レガシー検索">🔍</button>
    <button id="legacy-list-btn" title="登録ピン検索">📚</button>

    <button id="scan-btn" class="scan-button">もっと近づいてスキャン</button>

    <button id="request-btn" class="floating-btn" title="スポット投稿" style="bottom: 130px; background-color: #e67e22; color: white;">📍</button>
    <button id="help-btn" class="floating-btn" title="ヘルプ">❓</button>
    <button id="license-btn" class="floating-btn" title="ライセンス">📜</button>

    <div id="draw-result-panel" aria-live="polite">
        <div class="draw-panel-header">
            <div class="draw-panel-title">囲み表示累計</div>
            <button id="draw-clear-btn" type="button">通常表示に戻す</button>
        </div>
        <div id="draw-result-summary">ペンで地図を囲ってください</div>
        <div id="draw-result-breakdown"></div>
    </div>

    <div id="municipality-search-panel" aria-live="polite">
        <div class="municipality-panel-header">
            <div class="municipality-panel-title">万博レガシー検索</div>
            <div class="municipality-panel-actions">
                <button id="municipality-share-btn" type="button">URLコピー</button>
                <button id="municipality-close-btn" type="button">終了</button>
            </div>
        </div>
        <form id="municipality-search-form">
            <input id="municipality-search-input" type="search" placeholder="万博レガシーピン名を入力" autocomplete="off">
            <button id="municipality-submit-btn" type="submit">検索</button>
        </form>
        <div id="municipality-result-summary">万博レガシーピン名を入力してください</div>
        <input id="municipality-share-url" type="text" readonly aria-label="共有URL">
        <div id="municipality-result-breakdown"></div>
    </div>

    <div id="loading-screen">
        <img src="image_3.webp" id="loading-logo" alt="街の種ロゴ">
        <p class="warning-text">
            このアプリは複数の情報源を統合したデータです。<br>
            表示内容はスポットの更新状況や接続状態により変わる場合があります。<br>
            安全に配慮して、現地のルールを守ってご利用ください。
        </p>
        <div class="loading-status">
            <span class="loading-text">地図の準備中</span>
            <span class="loading-dots">...</span>
        </div>
    </div>

    <div id="map"></div>

    <script>
    setTimeout(() => {
        const s = document.getElementById('loading-screen');
        if (s && s.style.display !== 'none') {
            s.style.opacity = '0';
            setTimeout(() => { s.style.display = 'none'; }, 800);
        }
    }, 7000);
    </script>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/leaflet.markercluster.js"></script>
    <script src="app.js?v=3.0.51"></script>
</body>
</html>
